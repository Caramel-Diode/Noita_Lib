    <text x="20" y="260" style="font-size: 20px;" fill="#999">旨在提供一种简单的方式在网页中提供Noita元素渲染或数据支持。</text>
    <text x="20" y="290" style="font-size: 18px;" fill="#999">构建结果以单文件存在，数据与资源全部内联。</text>
