<svg width="900" height="400" viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg">
    <title>NoitaLib LOGO</title>
    <desc>基于 Web Component 技术构建的 Noita UI元素工具库。</desc>
    <defs>
        <linearGradient id="bg" x1="0.2132" y1="0.0904" x2="0.7868" y2="0.9096">
            <stop offset="0%" stop-color="#6F6F4F" />
            <stop offset="100%" stop-color="#1f1f1f" />
        </linearGradient>
        <style>
            * {
                box-sizing: border-box;
                padding: 0;
                margin: 0;
            }

            .pixel {
                height: 10px;
                width: 10px;
            }

            text {
                font-family: monospace;
            }

            #N,
            #o,
            #t,
            #a,
            #L,
            #i,
            #b {
                animation-name: blink;
                animation-duration: 3s;
                animation-iteration-count: infinite;
                animation-direction: alternate-reverse;
                animation-fill-mode: both;
            }

            #i-wand {
                animation-name: blink2;
                animation-duration: 1s;
                animation-iteration-count: infinite;
                animation-direction: alternate-reverse;
                animation-fill-mode: both;
            }

            @keyframes blink {
                from {
                    stroke-opacity: 0;
                }

                to {
                    stroke-opacity: 1;
                }
            }

            @keyframes blink2 {
                from {
                    fill-opacity: 0;
                }

                to {
                    fill-opacity: 1;
                }
            }
        </style>
    </defs>
